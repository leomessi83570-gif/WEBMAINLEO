# Netlify : « Base directory » = angramm (le reste est lu ici)
[build]
  command = "node build.mjs"
  publish = "site"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
  from = "/projets/"
  to = "/horizontal/projets/"
  status = 301

[[redirects]]
  from = "/work/volcan/"
  to = "/work/om/"
  status = 301
