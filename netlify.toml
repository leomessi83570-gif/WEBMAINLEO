# Netlify (déploiement depuis GitHub) : le site ANGRAMM « Duo » est dans angramm/.
# Rien à régler côté Netlify : base, commande et dossier publié sont lus ici.
[build]
  base = "angramm"
  command = "node build.mjs"
  publish = "site"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
  from = "/projets/"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/studio/"
  to = "/team/"
  status = 301

[[redirects]]
  from = "/horizontal/projets/"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/vertical/projets/"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/horizontal/"
  to = "/"
  status = 301

[[redirects]]
  from = "/vertical/"
  to = "/"
  status = 301

[[redirects]]
  from = "/work/volcan/"
  to = "/work/om/"
  status = 301

[[redirects]]
  from = "/work/lacoste-fw24/"
  to = "/projects/"
  status = 301
